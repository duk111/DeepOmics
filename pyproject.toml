
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsprism"
version = "0.5.0"
description = "Transcriptome-metabolome association analysis for key-gene prioritization and network construction"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "bioinformatics",
    "multi-omics",
    "transcriptomics",
    "metabolomics",
    "association network",
    "machine learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "anndata>=0.8.0",
    "click>=8.1.0",
    "matplotlib>=3.7.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "tqdm>=4.66.0",
    "xgboost>=1.7.0",
    "adjustText>=0.8",
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "colorspacious>=1.1.2",
]

[project.optional-dependencies]
deg = [
    "pydeseq2>=0.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
]
ui = [
    "streamlit>=1.32.0",
]

[project.urls]
Homepage = "https://github.com/yourname/omicsprism"
Repository = "https://github.com/yourname/omicsprism"
Issues = "https://github.com/yourname/omicsprism/issues"

[project.scripts]
omicsprism = "omicsprism.cli:main"
omicsprism-ui = "omicsprism.local_ui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omicsprism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
